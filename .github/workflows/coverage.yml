name: coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install

      - name: Run coverage
        run: forge coverage --report summary > coverage.txt

      - name: Extract coverage %
        run: |
          COVERAGE=$(cat coverage.txt | grep "Total" | awk '{print $4}' | tr -d '%')

          echo "Coverage: $COVERAGE"

          COLOR="red"
          if (( $(echo "$COVERAGE > 80" | bc -l) )); then COLOR="yellow"; fi
          if (( $(echo "$COVERAGE > 90" | bc -l) )); then COLOR="brightgreen"; fi

          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"${COLOR}\"}" > coverage.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages